plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lymeowz.nrooffline'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lymeowz.nrooffline'
        minSdk 23
        targetSdk 32
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Bundle the checked-in data/ directory as offline APK assets.
    sourceSets {
        main {
            assets.srcDirs = [file("${rootProject.projectDir}/../data")]
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA']
        }
    }
}
