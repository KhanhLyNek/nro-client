name: Reverse engineer NRO JAR

on:
  push:
    branches:
      - decompile-nro-jar
    paths:
      - 'input/*.jar'
      - 'scripts/decompile-jar.sh'
      - '.github/workflows/decompile-nro.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decompile-nro-jar
  cancel-in-progress: false

jobs:
  decompile:
    name: Extract Java sources from JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: decompile-nro-jar
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate input JARs
        id: check
        shell: bash
        run: |
          shopt -s nullglob
          jars=(input/*.jar)
          if (( ${#jars[@]} == 0 )); then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "### No input JAR yet" >> "$GITHUB_STEP_SUMMARY"
            echo "Upload NRO-Offline-1.0.2.jar into input/ on the decompile-nro-jar branch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            printf 'Found %s JAR(s).\n' "${#jars[@]}"
          fi

      - name: Decompile JARs into Java
        if: steps.check.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for jar in input/*.jar; do
            name="$(basename "$jar" .jar)"
            bash scripts/decompile-jar.sh "$jar" "decompiled/$name"
          done
          echo "### Decompilation finished" >> "$GITHUB_STEP_SUMMARY"
          find decompiled -name '*.java' | wc -l | xargs -I '{}' echo 'Recovered Java source files: {}' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload downloadable source artifact
        if: steps.check.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nro-decompiled-java
          path: decompiled/
          retention-days: 30
          if-no-files-found: error

      - name: Commit recovered source to this branch only
        if: steps.check.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- decompiled/
          if git diff --cached --quiet; then
            echo "No recovered-source changes to commit."
          else
            git commit -m "Add decompiled Java sources [skip ci]"
            git push origin HEAD:decompile-nro-jar
          fi
